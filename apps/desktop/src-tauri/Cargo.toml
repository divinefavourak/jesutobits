[package]
name = "jesutobits-desktop"
version = "0.0.0"
description = "Jesutobits Host: window, runtime supervision and the Workbench <-> runtime relay"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "jesutobits_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
# >= 2.11.1 for CVE-2026-42184 (RN-05). No shell, fs or http plugins (NFR-008).
tauri = { version = "2.12.4", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Folder picker, called by the Host itself (dialogs.rs) so the webview gets no dialog
# plugin. GTK on Linux (already linked by Tauri), not the D-Bus portal stack.
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
# Delete to the OS trash for the runtime (host_methods.rs, ADR-0014).
trash = "5.2.9"
# Log redaction patterns (logging/redact.rs); already in the tree through Tauri.
regex = "1.13.1"
tokio = { version = "1.53.3", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
