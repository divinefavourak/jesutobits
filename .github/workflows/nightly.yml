# Nightly gate (TESTING_STRATEGY.md section 7): what is too slow for every pull request. Uses
# the same scripts as developers.
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf:
    name: Performance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages

      # 100,000 files open without freezing (NFR-019, NFR-003): the runtime's index.
      - name: Large project (index)
        run: pnpm vitest run packages/services/test/large-tree.perf.test.ts
        env:
          JESUTOBITS_PERF: "1"
