# Pull request gate (TESTING_STRATEGY.md section 7). Uses the same scripts as developers.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The ripgrep half of the text-search tests (in the app, the extension uses VS Code's).
      - name: ripgrep
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ripgrep --no-progress -y; else sudo apt-get install -y ripgrep; fi
          echo "JESUTOBITS_TEST_RIPGREP=$(command -v rg)" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm build:extension
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generated files are up to date
        run: pnpm gen:check
