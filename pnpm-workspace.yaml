packages:
  - apps/*
  - packages/*
  # Built-in Jesutobits packs are real packages (EXTENSION_SYSTEM.md section 4.3), installed
  # by the extension from Phase 6.
  - extensions/builtin/*

# Fail on undeclared or mismatched engines instead of warning.
engineStrict: true

# Supply-chain safety: do not install versions published in the last 24 hours.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# Dependency install scripts are denied unless listed here with a reason.
allowBuilds:
  # The postinstall only verifies the binary that the @esbuild/<platform> optional dependency provides.
  esbuild: false
